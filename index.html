<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sigue tu pensión · Contra-Archivo (prototipo v1)</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<div class="aviso-proto" role="note">Prototipo v1 · no revisado aún por abogado</div>
<header class="cab">
  <div class="cab-fila">
    <a class="marca" href="#p0">Sigue tu pensión</a>
    <button class="btn-indice" aria-expanded="false" aria-controls="indice">☰ Índice</button>
  </div>
  <nav id="indice" class="indice" hidden aria-label="Pasos"></nav>
  <div class="cab-fila cab-estado">
    <span id="estado-afp" aria-live="polite"></span>
    <div class="nivel" role="radiogroup" aria-label="Nivel de detalle">
      <button role="radio" data-nivel="historia">Historia</button>
      <button role="radio" data-nivel="datos">Datos</button>
      <button role="radio" data-nivel="fuentes">Fuentes</button>
    </div>
  </div>
</header>
<main id="contenido" tabindex="-1"></main>
<footer class="pie">
  <p class="aviso-legal"><strong>Esto no es asesoría financiera, previsional ni legal.</strong> No recomendamos AFP ni fondo. Las cifras son del fondo de tu AFP, no de tu cuenta.</p>
  <nav class="pie-nav" aria-label="Navegación de pasos">
    <button id="ant">← Atrás</button>
    <a href="#p9">¿Cómo lo sabemos?</a>
    <button id="sig">Siguiente →</button>
  </nav>
</footer>
<dialog id="panel-fuente" aria-labelledby="pf-titulo">
  <form method="dialog"><button class="cerrar" aria-label="Cerrar">✕</button></form>
  <h2 id="pf-titulo">Fuente</h2>
  <dl id="pf-cuerpo"></dl>
</dialog>
<noscript><p class="nd-bloque">Este prototipo necesita JavaScript para cargar los datos desde data/datos.json.</p></noscript>
<script src="js/app.js"></script>
</body>
</html>
